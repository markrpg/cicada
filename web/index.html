<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#06040b">
<meta name="color-scheme" content="dark">
<title>Cicada</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M13.4 12.6C8.6 13.4 4.4 18 3.4 25.4c4.6-1.2 8.6-5 10.6-10.2M18.6 12.6c4.8.8 9 5.4 10 12.8-4.6-1.2-8.6-5-10.6-10.2' fill='%2319e6ff'/%3E%3Cpath d='M16 5.6c-2.2 0-3.7 1.5-3.7 3.4 0 .9.3 1.6.8 2.2-1 1-1.6 2.7-1.6 4.9 0 4.2 1.9 9.4 4.5 10.4 2.6-1 4.5-6.2 4.5-10.4 0-2.2-.6-3.9-1.6-4.9.5-.6.8-1.3.8-2.2 0-1.9-1.5-3.4-3.7-3.4z' fill='%237dff4a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="spectro" aria-hidden="true"></canvas>
<canvas id="bloom" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="mk-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19e6ff"/><stop offset="1" stop-color="#7dff4a" stop-opacity=".55"/></linearGradient>
          <linearGradient id="mk-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaff6b"/><stop offset="1" stop-color="#2bffc6"/></linearGradient>
        </defs>
        <path d="M13.4 12.6C8.6 13.4 4.4 18 3.4 25.4c4.6-1.2 8.6-5 10.6-10.2M18.6 12.6c4.8.8 9 5.4 10 12.8-4.6-1.2-8.6-5-10.6-10.2" fill="url(#mk-w)"/>
        <path d="M16 5.6c-2.2 0-3.7 1.5-3.7 3.4 0 .9.3 1.6.8 2.2-1 1-1.6 2.7-1.6 4.9 0 4.2 1.9 9.4 4.5 10.4 2.6-1 4.5-6.2 4.5-10.4 0-2.2-.6-3.9-1.6-4.9.5-.6.8-1.3.8-2.2 0-1.9-1.5-3.4-3.7-3.4z" fill="url(#mk-b)"/>
        <circle cx="13.1" cy="8.3" r="1.25" fill="#ff2b5e"/><circle cx="18.9" cy="8.3" r="1.25" fill="#ff2b5e"/>
      </svg>
      <span class="word">Cicada</span>
    </div>
    <label class="switch" title="Send immediately after Paste">
      <input type="checkbox" id="autosend">
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
      <span class="switch-label">Paste sends</span>
    </label>
  </header>

  <main class="feed" id="feed">
    <p class="empty" id="empty">Listen on one device, send from the other.</p>
  </main>

  <div class="toast" id="toast" role="alert" hidden>
    <span class="toast-msg" id="toast-msg"></span>
    <button class="toast-x" id="toast-x" aria-label="Dismiss">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <footer class="dock">
    <div class="staged" id="staged" hidden>
      <div class="staged-thumb" id="staged-thumb"></div>
      <div class="staged-info">
        <span class="staged-name" id="staged-name"></span>
        <span class="staged-meta" id="staged-meta"></span>
      </div>
      <button class="icon-btn small" id="staged-x" aria-label="Remove file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="composer">
      <textarea id="text" rows="1" placeholder="Type or paste" autocomplete="off" spellcheck="false" enterkeyhint="send" aria-label="Message"></textarea>
      <div class="row">
        <button class="listen" id="listen" aria-pressed="false">
          <span class="ring" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <span class="listen-label">Listen</span>
        </button>
        <button class="icon-btn" id="paste" aria-label="Paste from clipboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4.5" width="14" height="16.5" rx="2.5"/><path d="M9 4.5V4a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 4v.5M9 11h6M9 15h4"/></svg>
          <span class="btn-label">Paste</span>
        </button>
        <label class="icon-btn" id="file-btn">
          <input type="file" id="file" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.3-8.3a3.4 3.4 0 0 1 4.8 4.8l-8.2 8.2a1.7 1.7 0 0 1-2.4-2.4l7.4-7.4"/></svg>
          <span class="btn-label">File</span>
        </label>
        <button class="send" id="send" disabled>
          <span class="send-label">Send</span>
          <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>
        </button>
      </div>
    </div>
  </footer>
</div>

<div class="drop" id="drop" hidden><span>Drop to send</span></div>

<script type="module" src="app.js"></script>
</body>
</html>
